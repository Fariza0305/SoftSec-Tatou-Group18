[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tatou"
version = "0.1.0"
description = "Tatou PDF watermarking system"
authors = [
    {name = "SOFTSEC Group", email = "group@example.com"}
]
dependencies = [
    "Flask==2.3.3",
    "Werkzeug==2.3.7",
    "cffi==1.15.1",
    "cryptography==41.0.4",
    "pycparser==2.21",
    "six==1.16.0",
    "tomli==2.0.1",
    "pillow==10.0.0",
    "reportlab==4.0.4",
    "pypdf==3.15.0",
    "rmap @ https://github.com/nharrand/RMAP-Server/releases/download/v2.0.0/rmap-2.0.0-py3-none-any.whl",
]

[project.scripts]
pdfwm = "watermarking_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8"
]
