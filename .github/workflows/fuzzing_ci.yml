name: API Fuzzing CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run fuzzing daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of fuzzing iterations'
        required: false
        default: '100'

jobs:
  fuzzing:
    name: API Fuzzing Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tatou
          MYSQL_USER: tatou
          MYSQL_PASSWORD: tatou
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml requests reportlab
          
      - name: Start Tatou API server
        run: |
          docker-compose up -d
          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5000/healthz; do sleep 2; done'
          
      - name: Run API fuzzing
        id: fuzzing
        continue-on-error: true
        run: |
          cd fuzzing
          python api_fuzzer.py
          
      - name: Analyze bugs
        if: always()
        run: |
          if [ -f fuzzing/results/bugs_found.json ]; then
            python fuzzing/bug_detector.py fuzzing/results/bugs_found.json
          fi
          
      - name: Generate regression tests
        if: always()
        run: |
          if [ -f fuzzing/results/bugs_found.json ]; then
            python fuzzing/regression_test_generator.py fuzzing/results/bugs_found.json
          fi
          
      - name: Generate report
        if: always()
        run: |
          if [ -f fuzzing/results/bugs_found.json ]; then
            python fuzzing/report_generator.py
          fi
          
      - name: Upload fuzzing results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fuzzing-results
          path: |
            fuzzing/results/
            fuzzing/logs/
            fuzzing/regression_tests/
          retention-days: 30
          
      - name: Check for critical bugs
        if: always()
        run: |
          if [ -f fuzzing/results/bugs_found_analyzed.json ]; then
            CRITICAL=$(jq '.summary.by_severity.critical // 0' fuzzing/results/bugs_found_analyzed.json)
            HIGH=$(jq '.summary.by_severity.high // 0' fuzzing/results/bugs_found_analyzed.json)
            
            echo "Critical bugs: $CRITICAL"
            echo "High severity bugs: $HIGH"
            
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ CRITICAL vulnerabilities found!"
              exit 1
            fi
            
            if [ "$HIGH" -gt 5 ]; then
              echo "⚠️ Too many HIGH severity vulnerabilities found!"
              exit 1
            fi
          fi
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 Fuzzing Test Results\n\n';
            
            try {
              const stats = JSON.parse(fs.readFileSync('fuzzing/results/statistics.json', 'utf8'));
              const analysis = JSON.parse(fs.readFileSync('fuzzing/results/bugs_found_analyzed.json', 'utf8'));
              
              comment += `### Statistics\n`;
              comment += `- Total Requests: ${stats.total_requests}\n`;
              comment += `- Successful: ${stats.successful_requests}\n`;
              comment += `- Failed: ${stats.failed_requests}\n`;
              comment += `- Endpoints Tested: ${stats.endpoints_tested}\n\n`;
              
              comment += `### Bugs Found\n`;
              comment += `- 🔴 Critical: ${analysis.summary.by_severity.critical}\n`;
              comment += `- 🟠 High: ${analysis.summary.by_severity.high}\n`;
              comment += `- 🟡 Medium: ${analysis.summary.by_severity.medium}\n`;
              comment += `- 🟢 Low: ${analysis.summary.by_severity.low}\n\n`;
              
              if (analysis.summary.critical_count > 0) {
                comment += `\n⚠️ **CRITICAL vulnerabilities detected!**\n`;
              }
            } catch (e) {
              comment += `Error reading results: ${e.message}\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  regression-tests:
    name: Run Regression Tests
    runs-on: ubuntu-latest
    needs: fuzzing
    if: always()
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tatou
          MYSQL_USER: tatou
          MYSQL_PASSWORD: tatou
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Download fuzzing artifacts
        uses: actions/download-artifact@v3
        with:
          name: fuzzing-results
          path: fuzzing/
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html
          
      - name: Start Tatou API server
        run: |
          docker-compose up -d
          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5000/healthz; do sleep 2; done'
          
      - name: Run regression tests
        run: |
          cd fuzzing/regression_tests
          if [ -f run_all_tests.py ]; then
            python run_all_tests.py
          fi
          
      - name: Run pytest regression tests
        run: |
          cd fuzzing/regression_tests
          if [ -f test_regression_pytest.py ]; then
            pytest test_regression_pytest.py --html=report.html --self-contained-html -v
          fi
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-test-results
          path: |
            fuzzing/regression_tests/report.html
            fuzzing/regression_tests/regression_test_results.json
          retention-days: 30



